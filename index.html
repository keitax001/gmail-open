<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>メールアプリで開く</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 48px 24px; text-align: center; color: #202124; }
  a.button { display: block; max-width: 320px; margin: 12px auto; padding: 14px; border-radius: 24px; text-decoration: none; font-size: 16px; }
  #app { background: #1a73e8; color: #fff; }
  #web { border: 1px solid #dadce0; color: #1a73e8; }
  p.note { color: #5f6368; font-size: 13px; }
</style>
</head>
<body>
<h1 style="font-size:20px" id="title">メールアプリで開く</h1>
<a id="app" class="button" hidden>アプリで開く</a>
<a id="web" class="button" hidden>Web 版で開く</a>
<p class="note" id="msg">リンク情報を読み取っています…</p>
<script>
  // メールIDは URL フラグメント（#app=...&cv=...&acct=...）でのみ受け取る。
  // フラグメントは HTTP リクエストに含まれないため、サーバー側には一切送信されない。
  var params = new URLSearchParams(location.hash.slice(1));
  var provider = params.get("app") === "outlook" ? "outlook" : "gmail";
  var cv = params.get("cv") || "";
  var acct = params.get("acct") || "1";
  var appLink = document.getElementById("app");
  var webLink = document.getElementById("web");
  var msg = document.getElementById("msg");
  var appUrl = null;

  if (provider === "outlook") {
    // Outlook のメッセージ指定 deep link は公開されていないため、開くのは受信箱まで。
    document.getElementById("title").textContent = "Outlook で開く";
    appLink.textContent = "Outlook アプリで開く";
    appUrl = "ms-outlook://";
    msg.textContent = "アプリでは受信箱が開きます。自動で開かない場合は上のボタンを押してください。";
  } else if (/^[0-9a-fA-F]+$/.test(cv) && /^[0-9]+$/.test(acct)) {
    // Gmail のメッセージIDは16進、accountId は数値のみ許可（スキーム組み立てへの注入防止）
    document.getElementById("title").textContent = "Gmail で開く";
    appLink.textContent = "Gmail アプリで開く";
    appUrl = "googlegmail:///cv=" + cv + "/accountId=" + acct;
    webLink.href = "https://mail.google.com/mail/u/0/#inbox/" + cv;
    webLink.textContent = "Web 版 Gmail で開く";
    webLink.hidden = false;
    // 現行の Gmail iOS アプリは cv= のメッセージ指定を無視するため、開くのは受信箱まで
    // （2026-08 実機検証済み。復活に備えて cv= は付けたままにしている）。
    msg.textContent = "アプリでは受信箱が開きます。自動で開かない場合は上のボタンを押してください。";
  } else {
    msg.textContent = "リンクにメールIDがありません。通知からもう一度開いてください。";
  }

  if (appUrl) {
    appLink.href = appUrl;
    appLink.hidden = false;
    location.href = appUrl;
  }
</script>
</body>
</html>
